# D2 protocol v2.1 on NeRF-Synthetic lego, 8 training views. Base models from configs/blender_lego_v8.yaml.
reuse_from: runs/blender_lego_v8
out_dir: runs/d2v21_blender_lego_v8
seeds: [0, 1, 2, 3, 4, 5]

intervention:
  signals: [opacity, gradmag, visibility]
  frac: 0.05
  n_random: 5
  snapshots: [0, 200, 1000]
  region_alpha_thresh: 0.5
  region_weight_thresh: 0.2
  region_min_frac: 0.01
  neighborhood_radius: 0.05

analysis:
  snr_min: 2.0
  primary_step: 1000
