# Phase 0.5 — D2 protocol v2 on the Phase 0 checkpoints (scripts/d2_v2.py).
# Everything not listed here is taken from <reuse_from>/config.yaml.
reuse_from: runs/phase0      # base.pt + signals.pt per seed -> identical selections to Phase 0
out_dir: runs/phase0_5
seeds: [0, 1, 2]

intervention:
  signals: [opacity, gradmag, visibility]
  frac: 0.05
  n_random: 2
  snapshots: [0, 200, 1000]  # response right after removal and after re-optimization
  region_alpha_thresh: 0.5   # footprint mask (Phase 0)
  region_weight_thresh: 0.2  # weight mask: selected Gaussians carry >= 20% of the pixel
  neighborhood_radius: 0.05

analysis:
  snr_min: 2.0
  primary_step: 1000
