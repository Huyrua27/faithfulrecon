out_dir: runs/phase0
device: cuda
renderer: torch
seeds:
- 0
- 1
- 2
scene:
  type: synthetic
  resolution: 160
  fov_deg: 30
  cam_radius: 4.0
  n_gt_gaussians: 40000
  n_ref_points: 60000
  n_train_views: 8
  train_azim_range:
  - 0
  - 360
  train_elev_range:
  - 10
  - 50
  n_test_views: 16
init:
  n_points: 10000
  half_extent: 1.0
train:
  iterations: 5000
  densify_from: 300
  densify_until: 3000
  densify_every: 100
  opacity_reset_every: 2000
  max_gaussians: 120000
  log_every: 500
intervention:
  signals:
  - opacity
  - gradmag
  - visibility
  frac: 0.05
  n_random: 2
  reopt_steps: 1000
  region_alpha_thresh: 0.5
  neighborhood_radius: 0.05
labels:
  tau: 0.03
analysis:
  snr_min: 2.0
